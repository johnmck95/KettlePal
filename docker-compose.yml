version: "3.9"

services:
  postgres:
    image: postgres:16
    container_name: kettlepal-db
    restart: always
    environment:
      POSTGRES_DB: kettlepal-dev
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data

  backend:
    build:
      context: ./backend/graphql-server
    container_name: backend
    working_dir: /graphql-server
    ports:
      - "4000:4000"
    env_file:
      - ./backend/graphql-server/.env
    environment:
      NODE_ENV: ${NODE_ENV}
      ACCESS_TOKEN_SECRET: ${ACCESS_TOKEN_SECRET}
      REFRESH_TOKEN_SECRET: ${REFRESH_TOKEN_SECRET}
      PORT: 4000
    volumes:
      - ./backend/graphql-server:/graphql-server
      - /graphql-server/node_modules
    depends_on:
      - postgres
    develop:
      watch:
        - path: ./backend/graphql-server/src
          action: rebuild

  frontend:
    build:
      context: ./frontend/kettlepal-fe
    container_name: frontend
    ports:
      - "3000:3000"
    volumes:
      - ./frontend/kettlepal-fe:/kettlepal-fe
      - frontend_node_modules:/kettlepal-fe/node_modules
    environment:
      FAST_REFRESH: "true"
      WDS_SOCKET_HOST: "localhost"
      WDS_SOCKET_PORT: "3000"
    depends_on:
      - backend

volumes:
  postgres_data:
  frontend_node_modules:
